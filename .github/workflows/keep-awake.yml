name: Keep Campus Exchange Awake

on:
  schedule:
    # runs at minute 0,14,28,42 of every hour
    - cron: '*/14 * * * *'

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          STATUS=$(curl -o /dev/null -s -w "%{http_code}" https://campus-exchange-rhcm.onrender.com/healthz/)
          if [ "$STATUS" -ne 200 ]; then
            echo "Health check returned $STATUS" >&2
            exit 1
          fi
