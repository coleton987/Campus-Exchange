{% extends 'layout.html' %}

{%block title %}
   Seller Registration
{% endblock %}

{% block css %}

{% load static %}
    <link rel="stylesheet" href="{% static 'css/seller.css' %}">
    
{% endblock %}


{% block content %}
<div class="container">
    <h1>Register as a Seller</h1>
    <form method="POST" action="{% url 'start_onboarding' %}">
        {% csrf_token %}
        <label for="email">Email Address:</label>
        <input type="email" id="email" name="email" required>

        <button type="submit">Start Onboarding</button>
    </form>
</div>

{% endblock %}
